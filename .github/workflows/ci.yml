name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Browser acquisition and the fixture suite have separate finite budgets.
    # Keep enough bounded job time for both instead of cancelling a healthy E2E
    # run after dependency setup consumes the original shared 15-minute limit.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install pinned uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.5"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify reproducible inputs
        run: pnpm repro:verify

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Cache fixture browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install fixture browser
        timeout-minutes: 12
        run: pnpm exec playwright install --with-deps chromium

      - name: Run isolated fixture E2E
        # Keep the aggregate wrapper finite while preserving test-level limits,
        # retries, assertions, and artifact finalization.
        timeout-minutes: 18
        env:
          DEBUG: pw:webserver
        run: pnpm test:e2e:fixture

      - name: Upload fixture browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-browser-evidence-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results/playwright
          if-no-files-found: warn
          retention-days: 7

  x402-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/web/api/x402/requirements-test.lock

      - name: Install x402 test dependencies from official PyPI
        run: >-
          python -m pip install
          --index-url https://pypi.org/simple
          --require-hashes
          --requirement apps/web/api/x402/requirements-test.lock

      - name: Run offline x402 tests
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q apps/web/api/x402/tests
