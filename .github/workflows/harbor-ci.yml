name: Harbor CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  harbor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/harbor
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: services/harbor/.node-version
          cache: npm
          cache-dependency-path: services/harbor/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/web/api/x402/requirements-test.lock

      - name: Install x402 test dependencies from official PyPI
        working-directory: .
        run: >-
          python -m pip install
          --index-url https://pypi.org/simple
          --require-hashes
          --requirement apps/web/api/x402/requirements-test.lock

      - name: Verify destination integrity
        working-directory: .
        run: node scripts/integrity/verify.mjs

      - name: Install Harbor dependencies
        run: npm ci

      - name: Verify generated files
        run: npm run generate && git diff --exit-code

      - name: Typecheck Harbor
        run: npm run typecheck

      - name: Run Harbor offline tests
        env:
          PILOT_X402_PYTHON: python
        run: npm test

