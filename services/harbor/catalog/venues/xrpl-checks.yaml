id: xrpl-checks
name: XRPL Checks
kind: execution-primitive
layer: xrpl-l1
category:
  - payments
status:
  mainnet: live
  testnet: live
  devnet: live
execution:
  transactions:
    - CheckCreate
    - CheckCash
    - CheckCancel
  builders:
    - tx.checkCreate
    - tx.checkCash
    - tx.checkCancel
reads:
  - account_objects
  - account_tx
risks:
  - Mainnet live status describes protocol availability only; Harbor mainnet execution remains disabled and these builders accept test networks only.
  - A Check does not reserve funds when it is created, so CheckCash can fail if the sender lacks funds or usable liquidity at cashing time.
  - An expired Check remains on-ledger until canceled, and CheckCreate adds an owner-reserve obligation for the sender.
  - Issuer authorization, freeze settings, transfer fees, and trust-line state can affect token-denominated Checks.
  - CheckCreate authorizes future value movement and is never delegated by Harbor policy; CheckCash is in the default delegated set, while CheckCancel requires an explicit on-ledger permission and custom allowed transaction type.
links:
  site: https://xrpl.org/
  docs: https://xrpl.org/docs/concepts/payment-types/checks
  api: https://xrpl.org/docs/references/http-websocket-apis/public-api-methods/account-methods/account_objects
