name: Harbor CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  harbor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/harbor
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: services/harbor/.node-version
          cache: npm
          cache-dependency-path: services/harbor/package-lock.json

      - name: Verify destination integrity
        working-directory: .
        run: node scripts/integrity/verify.mjs

      - name: Install Harbor dependencies
        run: npm ci

      - name: Verify generated files
        run: npm run generate && git diff --exit-code

      - name: Typecheck Harbor
        run: npm run typecheck

      - name: Run Harbor offline tests
        run: npm test

