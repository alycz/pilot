id: xrpl-lending
name: XRPL Lending Protocol
kind: execution-primitive
layer: xrpl-l1
category:
  - lending
  - yield
status:
  mainnet: voting
  testnet: unavailable
  devnet: live
  lending-devnet: live
reads:
  - lending.brokers
risks:
  - "The protocol depends on the LendingProtocol and LendingProtocolV1_1 amendments; mainnet use must wait for the required amendments to be enabled."
  - "A read-only feature check confirmed LendingProtocol and LendingProtocolV1_1 on standard Devnet; amendment status must still be reconfirmed before building or submitting a transaction."
  - "A fresh check of the documented Lending-Devnet endpoint could not resolve its hostname, so its previously recorded live status was not independently revalidated for this update."
  - "Loans are fixed-term and uncollateralized: underwriting and credit-risk management occur off ledger, and first-loss capital can reduce but does not eliminate default losses."
  - "The current protocol does not automate on-ledger collateral or liquidation management. Issuer freeze and clawback controls can also affect non-XRP vault assets."
  - "Harbor exposes lending state as read-only; LoanSet requires a two-party signing workflow that the current TxBuild contract cannot represent, and the official transaction set has no LoanDraw transaction."
links:
  site: https://xrpl.org/docs/concepts/tokens/lending-protocol
  docs: https://xrpl.org/docs/tutorials/defi/lending/use-the-lending-protocol/create-a-loan
  api: https://xrpl.org/docs/references/http-websocket-apis/public-api-methods/ledger-methods/ledger_entry
